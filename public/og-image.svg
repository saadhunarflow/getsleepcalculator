<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#131c2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6c63ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="180" fill="#6c63ff" opacity="0.08" />
  <circle cx="150" cy="520" r="140" fill="#a78bfa" opacity="0.06" />
  <circle cx="600" cy="315" r="400" fill="#6c63ff" opacity="0.03" />

  <!-- Accent top bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#accent)" />

  <!-- Moon icon area -->
  <g transform="translate(82, 80)">
    <circle cx="0" cy="0" r="52" fill="#6c63ff" opacity="0.15" />
    <text x="0" y="18" font-size="48" text-anchor="middle" font-family="system-ui">🌙</text>
  </g>

  <!-- Site name -->
  <text x="158" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#6c63ff" letter-spacing="1">
    getsleepcalculator.net
  </text>

  <!-- Main headline -->
  <text x="82" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Sleep Calculator
  </text>

  <!-- Subtitle line 1 -->
  <text x="82" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="#94a3b8">
    Find your perfect bedtime &amp; wake-up time
  </text>
  <!-- Subtitle line 2 -->
  <text x="82" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="400" fill="#94a3b8">
    based on 90-minute sleep cycles.
  </text>

  <!-- Pill badges -->
  <g transform="translate(82, 400)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="200" height="44" rx="22" fill="#6c63ff" opacity="0.2" />
    <rect x="0" y="0" width="200" height="44" rx="22" fill="none" stroke="#6c63ff" stroke-width="1.5" />
    <text x="100" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#a78bfa" text-anchor="middle">🛏️ Bedtime Calculator</text>

    <!-- Badge 2 -->
    <rect x="216" y="0" width="216" height="44" rx="22" fill="#6c63ff" opacity="0.2" />
    <rect x="216" y="0" width="216" height="44" rx="22" fill="none" stroke="#6c63ff" stroke-width="1.5" />
    <text x="324" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#a78bfa" text-anchor="middle">⏰ Wake-Up Calculator</text>

    <!-- Badge 3 -->
    <rect x="448" y="0" width="188" height="44" rx="22" fill="#6c63ff" opacity="0.2" />
    <rect x="448" y="0" width="188" height="44" rx="22" fill="none" stroke="#6c63ff" stroke-width="1.5" />
    <text x="542" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#a78bfa" text-anchor="middle">💤 Nap Calculator</text>
  </g>

  <!-- Sleep cycles illustration (right side) -->
  <g transform="translate(780, 160)">
    <text x="100" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Sleep Cycles</text>

    <!-- Cycle bars -->
    <g transform="translate(0, 20)">
      <!-- Cycle labels -->
      <text x="10" y="15" font-size="13" fill="#64748b" font-family="system-ui">N1</text>
      <text x="10" y="55" font-size="13" fill="#64748b" font-family="system-ui">N2</text>
      <text x="10" y="95" font-size="13" fill="#64748b" font-family="system-ui">N3</text>
      <text x="10" y="135" font-size="13" fill="#64748b" font-family="system-ui">REM</text>

      <!-- Cycle 1 -->
      <rect x="50" y="5" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.5" />
      <rect x="50" y="40" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.7" />
      <rect x="50" y="75" width="30" height="20" rx="4" fill="#6c63ff" opacity="1" />
      <rect x="50" y="110" width="30" height="20" rx="4" fill="#a78bfa" opacity="0.4" />

      <!-- Cycle 2 -->
      <rect x="95" y="5" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.5" />
      <rect x="95" y="40" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.7" />
      <rect x="95" y="75" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.85" />
      <rect x="95" y="110" width="30" height="20" rx="4" fill="#a78bfa" opacity="0.6" />

      <!-- Cycle 3 -->
      <rect x="140" y="5" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.5" />
      <rect x="140" y="40" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.7" />
      <rect x="140" y="75" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.5" />
      <rect x="140" y="110" width="30" height="20" rx="4" fill="#a78bfa" opacity="0.8" />

      <!-- Cycle 4 -->
      <rect x="185" y="5" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.5" />
      <rect x="185" y="40" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.7" />
      <rect x="185" y="110" width="30" height="20" rx="4" fill="#a78bfa" opacity="0.9" />

      <!-- Cycle 5 (recommended) -->
      <rect x="230" y="5" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.5" />
      <rect x="230" y="40" width="30" height="20" rx="4" fill="#6c63ff" opacity="0.7" />
      <rect x="230" y="110" width="30" height="20" rx="4" fill="#a78bfa" opacity="1" />
      <text x="245" y="155" font-size="11" fill="#a78bfa" text-anchor="middle" font-weight="700">⭐</text>

      <!-- Cycle labels bottom -->
      <text x="65" y="180" font-size="12" fill="#64748b" text-anchor="middle" font-family="system-ui">1</text>
      <text x="110" y="180" font-size="12" fill="#64748b" text-anchor="middle" font-family="system-ui">2</text>
      <text x="155" y="180" font-size="12" fill="#64748b" text-anchor="middle" font-family="system-ui">3</text>
      <text x="200" y="180" font-size="12" fill="#64748b" text-anchor="middle" font-family="system-ui">4</text>
      <text x="245" y="180" font-size="12" fill="#a78bfa" text-anchor="middle" font-family="system-ui" font-weight="700">5</text>
    </g>

    <text x="100" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">90-min cycles</text>
  </g>

  <!-- Bottom tagline -->
  <text x="82" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" fill="#475569">
    Free • Science-based • No signup required
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" opacity="0.5" />
</svg>
