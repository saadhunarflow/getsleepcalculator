name: Deploy Sleep Calculator to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies & Build
        run: |
          npm ci
          npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts

            # Repo clone karo agar pehli baar hai
            if [ ! -d ~/getsleepcalculator/.git ]; then
              git clone git@github.com:saadhunarflow/getsleepcalculator.git ~/getsleepcalculator
            fi

            echo "Fetching latest code..."
            cd ~/getsleepcalculator
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies & building..."
            npm ci
            npm run build

            echo "Copying build to public_html..."
            rm -rf /home/u131596745/domains/getsleepcalculator.net/public_html/*
            cp -r ~/getsleepcalculator/out/. /home/u131596745/domains/getsleepcalculator.net/public_html/

            echo "Deploy complete!"